name = "wavespeed-prompt-generator"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
# Built React client (client/dist), served from the edge cache.
# Rebuild with `npm --prefix client run build` before deploying.
directory = "client/dist"

[[d1_databases]]
binding = "DB"
database_name = "wavespeed-models"
# Environment-specific. Replace with the id from `wrangler d1 create` on a fork.
database_id = "eef5c721-6172-4e19-9f72-f101cdd7da52"

[[d1_databases]]
binding = "HISTORY"
database_name = "genai-history"
# Environment-specific. Replace with the id from `wrangler d1 create` on a fork.
database_id = "6a271502-ea90-411b-935c-50a16d5d5300"

[[r2_buckets]]
binding = "OUTPUTS_BUCKET"
bucket_name = "genai-assets"

[vars]
# Rollback switch for Prompt Atlas guide injection. Set to "0" to disable
# without a code change — see docs/prompt-atlas-rollback.md.
GUIDE_INJECTION = "1"
WAVESPEED_BASE_URL = "https://api.wavespeed.ai/api/v3"
# Secrets, set via .dev.vars locally or `wrangler secret put` per environment.
# See .dev.vars.example for the full list with placeholders.
#
# The enhancer resolves each provider's key from the `apiKeyEnv` named on its
# entry in src/worker.js DEFAULT_LLM_PROVIDERS — that field is what replaced the
# old baseUrl.includes('venice.ai') sniff, which sent the OpenRouter key to every
# host that was not literally venice.ai. Adding a provider means adding its
# secret here too:
#   WAVESPEED_API_KEY    - generation, polling, upload, stays server-side
#   EXPLABS_API_KEY      - https://api.experientiallabs.ai/v1 (chain default, first)
#   OPENROUTER_API_KEY   - https://openrouter.ai/api/v1
#   VENICE_API_KEY       - https://api.venice.ai/api/v1
#   HUGGINGFACE_API_KEY  - LoRA URL resolution against the Hub
#   CIVITAI_API_KEY      - authenticated CivitAI model lookups
#   JEV_API_KEY          - /api/judge proxy
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY - presigned GET URLs
# An entry with no apiKeyEnv falls back to the legacy venice sniff, so llm_config
# rows written before the field existed keep working.
# R2 presigned URLs for cloud file picker (worker fetches nothing; provider pulls directly).
# Secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY via `wrangler secret put`.
# R2_ACCOUNT_ID is an account identifier, not a credential, but it is still
# environment-specific: substitute your own before deploying a fork.
R2_ACCOUNT_ID = "3e37b0a010de20bc7fc5b6c9d0dcb285"
R2_BUCKET = "genai-assets"

# No HF_PROXY_REPO_ALLOWLIST here on purpose: this Worker has no /api/hf/file
# route. LoRA weights are fetched by WaveSpeed's own servers straight from the
# Hub, so public and private adapters alike are referenced by URL and nothing
# needs proxying through this account's HUGGINGFACE_API_KEY. The key is used
# only to read model-card metadata when resolving a LoRA URL.
