name = "wavespeed-prompt-generator"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
# BRANCH-ONLY (feature/wavespeed-react): serve the Vite build. main keeps "public".
directory = "client/dist"

[[d1_databases]]
binding = "DB"
database_name = "wavespeed-models"
database_id = "eef5c721-6172-4e19-9f72-f101cdd7da52"

[[d1_databases]]
binding = "HISTORY"
database_name = "genai-history"
database_id = "6a271502-ea90-411b-935c-50a16d5d5300"

[[r2_buckets]]
binding = "OUTPUTS_BUCKET"
bucket_name = "genai-assets"

[vars]
WAVESPEED_BASE_URL = "https://api.wavespeed.ai/api/v3"
# R2 presigned URLs for cloud file picker (worker fetches nothing; provider pulls directly).
# Secrets R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY via `wrangler secret put`.
R2_ACCOUNT_ID = "3e37b0a010de20bc7fc5b6c9d0dcb285"
R2_BUCKET = "genai-assets"
